[package]
name = "zsurf-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Switch projects with ranked search and Git context"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/zurf"

[[bin]]
name = "zurf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
ratatui = "0.29"
fuzzy-matcher = "0.3"
filedescriptor = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
bincode = "1.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
